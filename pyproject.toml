[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-harness"
version = "0.1.0"
description = "Desktop computer-use agent with MCP server, orchestrator, and desktop shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "pyautogui>=0.9.54",
  "mss>=9.0.0",
  "pynput>=1.7.6",
  "pydantic>=2.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
